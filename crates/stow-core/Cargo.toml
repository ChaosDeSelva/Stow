[package]
name = "stow-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "Stow core: storage, capture, fetching, jobs, AI and audio (no UI)"

[dependencies]
rusqlite = { workspace = true, features = ["backup"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros", "fs", "io-util", "net"] }
reqwest.workspace = true
url.workspace = true
chrono.workspace = true
ulid.workspace = true
dirs.workspace = true
tracing.workspace = true
scraper.workspace = true
dom_smoothie.workspace = true
htmd.workspace = true
mime_guess.workspace = true
encoding_rs.workspace = true
http.workspace = true
hyper-util.workspace = true
tower-layer.workspace = true
tower-service.workspace = true
async-trait = { workspace = true, optional = true }
keyring = { workspace = true, optional = true }
cpal = { workspace = true, optional = true }
hound = { workspace = true, optional = true }
whisper-rs = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[features]
default = ["audio", "transcribe", "ai", "keychain"]
audio = ["dep:cpal", "dep:hound"]
transcribe = ["audio", "dep:whisper-rs", "dep:sha2"]
metal = ["whisper-rs?/metal"]
ai = ["dep:async-trait"]
keychain = ["dep:keyring"]

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
wiremock.workspace = true

[lints]
workspace = true
