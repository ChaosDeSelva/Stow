<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stow options</title>
<style>
  :root { --canvas:#eeefe9; --card:#fff; --soft:#e5e7e0; --hair:#bfc1b7; --ink:#23251d; --body:#4d4f46; --mute:#63655b; --primary:#f7a501; --primary-pressed:#dd9001; --green:#2c8c66; --green-soft:#d9eddf; --red:#cd4239; --red-soft:#f7d6d3; --blue-soft:#dceaf6; --link:#1078a3; }
  @media (prefers-color-scheme: dark) { :root { --canvas:#1d1f1a; --card:#23251d; --soft:#2a2c25; --hair:#3f4138; --ink:#eeefe9; --body:#c9cbc0; --mute:#9b9c92; --green-soft:#1f3a2d; --red-soft:#452320; --blue-soft:#1f3242; --link:#4fb3dd; } }
  body { font: 14px/1.43 -apple-system, "IBM Plex Sans", system-ui, sans-serif; margin: 0; padding: 16px; width: 340px; background: var(--canvas); color: var(--body); }
  h1 { font-size: 16px; font-weight: 700; color: var(--ink); margin: 0 0 4px; }
  .card { background: var(--card); border: 1px solid var(--hair); border-radius: 6px; padding: 16px; margin-top: 12px; }
  label { display:block; font-weight: 600; color: var(--ink); margin: 0 0 4px; }
  .hint { color: var(--mute); font-size: 13px; margin: 4px 0 0; }
  input[type=text], input[type=password], select { width: 100%; box-sizing: border-box; height: 36px; padding: 8px 12px; border: 1px solid var(--hair); border-radius: 6px; background: var(--card); color: var(--ink); font: inherit; }
  input:focus, select:focus { outline: 2px solid #2c84e0; outline-offset: 1px; }
  .row { display:flex; align-items:center; gap: 8px; margin-top: 12px; }
  button { font: inherit; font-weight: 700; height: 36px; padding: 0 14px; border-radius: 6px; border: 1px solid transparent; background: var(--soft); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--primary); color: #23251d; }
  button.primary:active { background: var(--primary-pressed); }
  #status { margin-top: 10px; padding: 10px 12px; border-radius: 6px; display: none; }
  #status.ok { display:block; background: var(--green-soft); color: var(--ink); }
  #status.err { display:block; background: var(--red-soft); color: var(--ink); }
  #status.info { display:block; background: var(--blue-soft); color: var(--ink); }
  a { color: var(--link); }
</style>
</head>
<body>
  <h1>Stow</h1>
  <p class="hint">Pair this button with the Stow app on this Mac. Nothing leaves your computer.</p>

  <div class="card">
    <label for="code">Pairing code</label>
    <input id="code" type="password" placeholder="Paste from Stow → Settings → Chrome extension" autocomplete="off">
    <p class="hint">Or click <strong>Pair automatically</strong> and approve the request in Stow.</p>
    <div class="row">
      <button id="save" class="primary">Save</button>
      <button id="auto">Pair automatically</button>
    </div>
    <div id="status" role="status"></div>
  </div>

  <div class="card">
    <label for="bucket">Save into</label>
    <select id="bucket"><option value="">Inbox</option></select>
    <div class="row"><input id="closeTab" type="checkbox"><label for="closeTab" style="margin:0; font-weight:500">Close the tab after saving</label></div>
    <p class="hint">Tip: you can also press ⌃⌘S anywhere in Chrome.</p>
  </div>
  <script type="module" src="options.js"></script>
</body>
</html>
