[workspace]
members = ["crates/stow-core", "crates/stow-cli", "crates/stow-mcp", "apps/stow-app/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.88"
repository = "https://github.com/ChaosDeSelva/Stow"
description = "Local-first read-later app: park browser tabs in intent buckets"
readme = "README.md"

[workspace.dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "charset", "http2"] }
url = { version = "2", features = ["serde"] }
chrono = "0.4"
ulid = "3"
dirs = "7"
tempfile = "3"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
scraper = "0.29"
dom_smoothie = "0.19"
htmd = "0.5"
mime_guess = "2"
encoding_rs = "0.8"
http = "1"
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "tokio"] }
tower-layer = "0.3"
tower-service = "0.3"
sha2 = "0.10"
async-trait = "0.1"
keyring = "4"
cpal = "0.18"
hound = "3"
whisper-rs = "0.16"
axum = "0.8"
tower-http = { version = "0.7", features = ["cors"] }
rand = "0.10"
tracing = "0.1"
tracing-subscriber = "0.3"
wiremock = "0.6"
assert_cmd = "2"
predicates = "3"
rmcp = { version = "3.9", default-features = false, features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
# Tests write `assert!(v.is_empty(), "why")`; the suggested `assert_eq!(v, [] as [T; 0])`
# is noisier and the message already explains the failure.
assert_is_empty = "allow"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# Build scripts and proc-macros only (never shipped). With an explicit --target
# (`just build`), cargo strips these host dylibs, and the macOS 27 `strip`
# corrupts them ("mis-aligned LINKEDIT string pool"), so every derive fails to load.
[profile.release.build-override]
strip = false
